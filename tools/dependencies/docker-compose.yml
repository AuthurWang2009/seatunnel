version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: seatunnel-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  oceanbase:
    image: oceanbase/oceanbase-ce:latest
    container_name: seatunnel-oceanbase
    environment:
      MODE: mini
    ports:
      - "2881:2881"

  hive:
    image: apache/hive:latest
    container_name: seatunnel-hive
    ports:
      - "10000:10000"
      - "10002:10002"
    environment:
      SERVICE_NAME: hiveserver2

  sftp:
    image: atmoz/sftp:latest
    container_name: seatunnel-sftp
    ports:
      - "2222:22"
    command: seatunnel:seatunnel:::upload

  ftp:
    image: fauria/vsftpd:latest
    container_name: seatunnel-ftp
    ports:
      - "20:20"
      - "21:21"
      - "21100-21110:21100-21110"
    environment:
      FTP_USER: seatunnel
      FTP_PASS: seatunnel
      PASV_ADDRESS: 127.0.0.1
      PASV_MIN_PORT: 21100
      PASV_MAX_PORT: 21110

  mockserver:
    image: mockserver/mockserver:5.14.0
    container_name: seatunnel-mockserver
    ports:
      - "1080:1080"
    environment:
      MOCKSERVER_SERVER_PORT: 1080

networks:
  default:
    name: seatunnel-e2e-net
