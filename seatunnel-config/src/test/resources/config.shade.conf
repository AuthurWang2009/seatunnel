env {
  execution.parallelism = 1
  shade.options = ["f1", "list"]
}

source = [
  {
    plugin_name = "FakeSource"
    result_table_name = "fake"
    field_name = "name,age"
    schema = {
      fields {
        name = "string"
        age = "int"
        sex = "boolean"
      }
    }
    username = "seatunnel"
    password = "seatunnel_password"
    access_key = "access_key"
    secret_key = "secret_key"
    f1 = "v1"
    config1 {
        f1 = "v1"
    }
    config2 {
        list = ["v1", "v2", "v3"]
    }
  }
]

transform = [
  {
    plugin_name = "Sql"
    source_table_name = "fake"
    result_table_name = "sql"
    query = "select name, age from fake"
  }
]

sink = [
  {
    plugin_name = "Console"
    source_table_name = "sql"
  }
]
