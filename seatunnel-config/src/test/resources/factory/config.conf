
env {
  spark.app.name = "SeaTunnel"
  spark.executor.instances = 2
  spark.executor.cores = 1
  spark.executor.memory = "1g"
  spark.stream.batchDuration = 5
}

source = [
  {
    plugin_name = "fakeStream"
    content = ["Hello World, SeaTunnel"]
  }
]

transform = [
  {
    plugin_name = "split"
    fields = ["msg", "name"]
    delimiter = ","
  },
  {
    plugin_name = "sql1"
    sql = "sql1"
  },
  {
    plugin_name = "sql2"
    sql = "sql2"
  },
  {
    plugin_name = "sql3"
    sql = "sql3"
  },
  {
    plugin_name = "json"
    sql = "sql3"
  }
]

sink = [
  {
    plugin_name = "Console"
  },
  {
    plugin_name = "c.Console"
  }
]
